site_name: GISBoost
site_url: https://gisboost.github.io/
theme:
  name: material
  font:
    text: Montserrat
    code: Roboto Mono
  logo: assets/icon_gisboost.png
  favicon: assets/favicon.ico
  palette:
    # Dark Mode
    - scheme: slate
      toggle:
        icon: material/weather-night
        name: Dark mode
      primary: green
      accent: light blue
  
    # Light Mode
    - scheme: default
      toggle:
        icon: material/weather-sunny
        name: Light mode
      primary: green
      accent: light blue
  features:
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.instant.progress
    - navigation.tabs
    #- navigation.tracking
    #- navigation.tabs.sticky
    - toc.integrate
    - toc.follow
    - content.code.copy



markdown_extensions:
  - attr_list
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - md_in_html
  - pymdownx.blocks.caption
  - def_list

plugins:
  - search

extra:
  social:
    - icon: simple/youtube
      link: https://www.youtube.com/@GISBoost/
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/michal-kaczorowsky/
    - icon: simple/instagram
      link: https://www.instagram.com/gisboost/
    - icon: simple/tiktok
      link: https://www.tiktok.com/@gisboost/

nav:
  - Strona główna: index.md
  - O mnie: O-mnie.md
  - Projekty:
    - easy-OTP: projekty/easy-otp.md
    - easy-GTFS-RT: projekty/easy-gtfs-rt.md
    - GTFS Dashboard: projekty/gtfs-dashboard.md
    - Mapy analiz: projekty/mapy-analizy.md
  - Analizy:
    - Wszystkie analizy: analizy/index.md
    - Dochód na poziomie obwodu spisowego: analizy/dochod-obwody-spisowe.md
    - Dostępność a dochód w Łodzi: analizy/dostepnosc-dochod-lodz.md
    - Dostępność do uczelni w 6 miastach: analizy/dostepnosc-uczelnie.md
  - Artykuły naukowe: artykuly.md
  - Konferencje:
    - GISday 2025: konferencje/gisday_2025.md
    - Sympozjum kół naukowych 2025: konferencje/sympozjum2025.md
    - IV spotkanie użytkowników QGIS w Polsce 2025: konferencje/iv_qgis2025.md
    - Konferencja Łowicz 2025: konferencje/lowicz_2025.md
    - Konferencja Rzeszów: konferencje/konferencja_rzeszow.md
    - MIASTO 2025: konferencje/miasto_2025.md
    - GISday 2024: konferencje/gisday_2024.md
  - Poradniki:
    - OTP: OpenTripPlanner.md
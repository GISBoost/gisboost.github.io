site_name: GISBoost
site_url: https://gisboost.github.io/
theme:
  name: material
  custom_dir: overrides
  font:
    text: IBM Plex Sans
    code: IBM Plex Mono
  logo: assets/icon_gisboost.png
  favicon: assets/favicon.ico
  palette:
    # Dark Mode
    - scheme: slate
      toggle:
        icon: material/weather-night
        name: Dark mode
      primary: blue grey
      accent: blue

    # Light Mode
    - scheme: default
      toggle:
        icon: material/weather-sunny
        name: Light mode
      primary: blue grey
      accent: blue
  features:
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.instant.progress
    - navigation.tabs
    #- navigation.tracking
    #- navigation.tabs.sticky
    - toc.integrate
    - toc.follow
    - content.code.copy

extra_css:
  - assets/gisboost-1.css
  - assets/mkdocs-overrides.css

markdown_extensions:
  - attr_list
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - md_in_html
  - pymdownx.blocks.caption
  - def_list

plugins:
  - search

extra:
  social:
    - icon: simple/youtube
      link: https://www.youtube.com/@GISBoost/
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/michal-kaczorowsky/
    - icon: simple/instagram
      link: https://www.instagram.com/gisboost/
    - icon: simple/tiktok
      link: https://www.tiktok.com/@gisboost/

nav:
  - Start: index.md
  - Narzędzia:
    - easy-GTFS-RT: projekty/easy-gtfs-rt.md
    - easy-OTP: projekty/easy-otp.md
    - Easy-R5: projekty/easy-r5.md
    - GTFS Dashboard: projekty/gtfs-dashboard.md
  - Analizy: analizy/index.md
  - Publikacje:
    - Artykuły naukowe: artykuly.md
    - GISday 2025: konferencje/gisday_2025.md
    - Sympozjum kół naukowych 2025: konferencje/sympozjum2025.md
    - IV spotkanie użytkowników QGIS w Polsce 2025: konferencje/iv_qgis2025.md
    - Konferencja Łowicz 2025: konferencje/lowicz_2025.md
    - Konferencja Rzeszów: konferencje/konferencja_rzeszow.md
    - MIASTO 2025: konferencje/miasto_2025.md
    - GISday 2024: konferencje/gisday_2024.md
    - Poradnik OTP: OpenTripPlanner.md
  - Współpraca: wspolpraca.md
  - O mnie: O-mnie.md